syntax = "proto3";

package collabdocs.raft.v1;

service RaftService {
  rpc RequestVote(VoteRequest) returns (VoteReply);
  rpc AppendEntries(AppendRequest) returns (AppendReply);
  rpc GetStatus(StatusRequest) returns (StatusReply);
}

message VoteRequest {
  string candidate_id = 1;
  uint64 term = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message VoteReply {
  uint64 term = 1;
  bool granted = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes command = 3;
}

message AppendRequest {
  string leader_id = 1;
  uint64 term = 2;
  uint64 previous_index = 3;
  uint64 previous_term = 4;
  uint64 leader_commit = 5;
  repeated LogEntry entries = 6;
}

message AppendReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message StatusRequest {}

message StatusReply {
  string node_id = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 commit_index = 5;
  uint64 applied_index = 6;
}
