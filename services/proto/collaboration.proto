syntax = "proto3";

package collabdocs.v1;

service CollaborationService {
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc SetSharing(SetSharingRequest) returns (Document);
  rpc ImportDocument(ImportDocumentRequest) returns (Document);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc GetVersion(GetVersionRequest) returns (DocumentVersion);
  rpc Sync(stream ClientEvent) returns (stream ServerEvent);
}

message Document {
  string id = 1;
  string title = 2;
  string owner_id = 3;
  bool share_enabled = 4;
  string updated_at = 5;
}

message CreateDocumentRequest {
  string user_id = 1;
  string title = 2;
  string operation_id = 3;
}

message ListDocumentsRequest {
  string user_id = 1;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message GetDocumentRequest {
  string document_id = 1;
  string user_id = 2;
}

message SetSharingRequest {
  string document_id = 1;
  string user_id = 2;
  bool enabled = 3;
  string operation_id = 4;
}

message Join {
  string document_id = 1;
  string user_id = 2;
}

message Edit {
  string operation_id = 1;
  bytes update = 2;
}

message Rename {
  string title = 1;
  string operation_id = 2;
}

message ClientEvent {
  oneof event {
    Join join = 1;
    Edit edit = 2;
    Rename rename = 3;
  }
}

message Snapshot {
  bytes update = 1;
  string title = 2;
  bool history_enabled = 3;
  optional bool share_enabled = 4;
}

message CommittedEdit {
  string operation_id = 1;
  bytes update = 2;
}

message EditAcknowledgement {
  string operation_id = 1;
}

message TitleChanged {
  string title = 1;
  string operation_id = 2;
}

message AccessRevoked {}

message ServerEvent {
  oneof event {
    Snapshot snapshot = 1;
    CommittedEdit edit = 2;
    EditAcknowledgement acknowledgement = 3;
    TitleChanged title_changed = 4;
    AccessRevoked access_revoked = 5;
  }
}

message ListVersionsRequest {
  string document_id = 1;
  string user_id = 2;
  uint64 before = 3;
}

message VersionMetadata {
  uint64 revision = 1;
  string title = 2;
  string actor_id = 3;
  string timestamp = 4;
  string kind = 5;
}

message ListVersionsResponse {
  repeated VersionMetadata versions = 1;
  uint64 next_before = 2;
}

message GetVersionRequest {
  string document_id = 1;
  string user_id = 2;
  uint64 revision = 3;
}

message DocumentVersion {
  VersionMetadata metadata = 1;
  bytes update = 2;
}

message ImportDocumentRequest {
  Document document = 1;
  bytes update = 2;
}
