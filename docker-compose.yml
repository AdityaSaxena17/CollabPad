services:
  postgres:
    image: postgres:17-alpine
    container_name: collab-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
    ports:
      - "${COLLAB_DOCS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - collab_docs_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["alembic", "-c", "services/alembic.ini", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  collaboration:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "services.collaboration.main"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--ws-max-size", "2097152"]
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COLLABORATION_TARGET: collaboration:50051
    ports:
      - "${GATEWAY_PORT:-18080}:8000"
    depends_on:
      collaboration:
        condition: service_started
    restart: unless-stopped

volumes:
  collab_docs_postgres_data:
