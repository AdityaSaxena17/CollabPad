services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
    ports:
      - "${COLLAB_DOCS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - collab_docs_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["alembic", "-c", "services/alembic.ini", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  collaboration:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "services.collaboration.main"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--notify-keyspace-events", "Ex"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  llm:
    build:
      context: .
      dockerfile: services/Dockerfile.llm
    command: ["python", "-m", "services.llm.main"]
    environment:
      LLM_MODEL_PATH: /models/${LLM_MODEL_FILE:-model.gguf}
      LLM_N_CTX: ${LLM_N_CTX:-4096}
      LLM_N_THREADS: ${LLM_N_THREADS:-4}
      LLM_N_GPU_LAYERS: ${LLM_N_GPU_LAYERS:-0}
    volumes:
      - ${LLM_MODEL_DIR:-./models}:/models:ro
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--ws-max-size", "2097152", "--ws-ping-interval", "15", "--ws-ping-timeout", "15"]
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COLLABORATION_TARGET: collaboration:50051
      LLM_TARGET: ${LLM_TARGET:-llm:50052}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${GATEWAY_PORT:-18080}:8000"
    depends_on:
      collaboration:
        condition: service_started
      llm:
        condition: service_started
    restart: unless-stopped

volumes:
  collab_docs_postgres_data:
