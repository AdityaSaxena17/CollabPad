services:
  llm:
    build:
      dockerfile: services/Dockerfile
    command: ["python", "-m", "services.tests.fake_llm"]
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
    command: ["python", "-m", "services.tests.run_suite"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
      POSTGRES_USER: ${POSTGRES_USER:-collab_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_docs_dev}
      COLLABORATION_TARGET: collaboration:50051
      LLM_TARGET: llm:50052
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_integration_placeholder}
    volumes:
      - ./coverage:/app/coverage
    depends_on:
      collaboration:
        condition: service_started
      redis:
        condition: service_healthy
      llm:
        condition: service_started
